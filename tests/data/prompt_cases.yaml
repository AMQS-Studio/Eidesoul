# Prompt contract cases (ADR-0033 §6.11): properties, never word-for-word text.
# Each case builds the real system prompt for one soul and one body section.
cases:
  - id: dispatch-only
    language: en
    locale: en-US
    timezone: UTC
    section: ""
    stable_prefix_hash: 9481e0d6d45aea81
    expect_contains:
      - "Voice: avoid swearing"
      - "Hard floor"
    expect_absent:
      - "DM"
      - "group chat"
      - "sticker"
      - "mention="
      - "WhatsApp"
      - "chat_history"
  - id: console-body
    language: en
    locale: en-US
    timezone: UTC
    section_from: console
    stable_prefix_hash: bf145db5230ece2a
    expect_contains:
      - "## Console interface"
    expect_absent:
      - "sticker"
      - "mention="
  - id: room-body
    language: en
    locale: en-US
    timezone: UTC
    section: "## Room\nThis thread is shared with other people; another person may be addressed."
    stable_prefix_hash: d50acf6d50e3050e
    expect_contains:
      - "This thread is shared"
    expect_absent:
      - "DM"
      - "WhatsApp"
