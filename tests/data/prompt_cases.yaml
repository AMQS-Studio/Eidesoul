# Prompt contract cases (ADR-0033 §6.11): properties, never word-for-word text.
# Each case builds the real system prompt for one soul and one body section.
cases:
  - id: dispatch-only
    language: en
    locale: en-US
    timezone: UTC
    section: ""
    stable_prefix_hash: 50d69771e510194d
    expect_contains:
      - "Toxicity level"
      - "Hard floor no level unlocks"
    expect_absent:
      - "DM"
      - "group chat"
      - "sticker"
      - "mention="
      - "WhatsApp"
      - "chat_history"
  - id: cli-body
    language: en
    locale: en-US
    timezone: UTC
    section_from: cli
    stable_prefix_hash: b58c4c9785a2d4b3
    expect_contains:
      - "## CLI interface"
    expect_absent:
      - "sticker"
      - "mention="
  - id: room-body
    language: en
    locale: en-US
    timezone: UTC
    section: "## Room\nThis thread is shared with other people; another person may be addressed."
    stable_prefix_hash: b14660b1ef7dd4c7
    expect_contains:
      - "This thread is shared"
    expect_absent:
      - "DM"
      - "WhatsApp"
