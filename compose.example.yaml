# Example deployment: Postgres+pgvector as one soul database, Eidesoul as the primary.
# Copy to compose.yaml and fill in the password; never commit credentials.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: eidesoul
      POSTGRES_USER: eidesoul
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - eidesoul-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidesoul -d eidesoul"]
      interval: 5s
      timeout: 5s
      retries: 20

  eidesoul:
    build:
      context: .
      args:
        EXTRAS: "--extra memory --extra vibe"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      EIDESOUL_DATABASE_URL: postgresql+psycopg://eidesoul:CHANGE_ME@postgres:5432/eidesoul
      GOOGLE_SERVICE_ACCOUNT_PATH: /run/secrets/google-sa.json
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./roles.yaml:/app/roles.yaml
      - ./soul.yaml:/app/soul.yaml
      - ./.eidesoul:/app/.eidesoul
      - ./secrets/google-sa.json:/run/secrets/google-sa.json:ro
      - /var/run/docker.sock:/var/run/docker.sock

  sandbox-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./deploy/sandbox-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - eidesoul-sandbox
      - dokploy-network

volumes:
  eidesoul-pg:

networks:
  eidesoul-sandbox:
    name: eidesoul-sandbox
    internal: true
  dokploy-network:
    external: true
