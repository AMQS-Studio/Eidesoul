roles:
  administrator:
    name: administrator
    label: ''
    protected: true
    description: Administrator of Eidesoul
    priority: 100
    users: []
    tools:
    - '*'
    commands:
    - '*'
    memory_admin: true
    context: 'You are talking to the administrator of Eidesoul, who sets the direction,
      permissions, and soul.

      Allows corrections, config/soul changes, and full reports.

      '
  member:
    name: member
    label: ''
    description: Member of this deployment
    priority: 10
    users: []
    tools:
    - read
    - grep
    - fetch
    - web_search
    - chat_history
    - memory
    - info
    commands:
    - help
    - ping
    - link
    - unlink
    - whoami
    - status
    - tools
    memory_admin: false
    context: 'You are talking to a member. Help with their work without opening new
      permissions.

      '
  guest:
    name: guest
    label: ''
    description: Unknown sender
    priority: 0
    users: []
    tools:
    - read
    - grep
    - fetch
    - web_search
    - chat_history
    - info
    commands:
    - help
    - ping
    - link
    - unlink
    - whoami
    - status
    - tools
    memory_admin: false
    context: 'You do not know this person yet. Stay polite and never open another
      chat''s data.

      '
