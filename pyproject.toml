[project]
name = "monoagens"
version = "0.0.0.dev0"
description = "MonoAgens: a persistent agent harness."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abdul Muqsith", email = "136996767+inimuqsith@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "openai>=2,<4",
  "httpx>=0.27,<1",
  "mcp>=2.3,<3",
  "PyYAML>=6",
  "ddgs>=9",
  "mem0ai>=2.2,<3",
  "sentence-transformers>=5.2,<6",
  # ADR-0038 §4.1/§5.1: local entity layer. spaCy model packages are not on PyPI, so the
  # verified multilingual model is a direct wheel; the fragment pins its sha256.
  "presidio-analyzer>=2.2,<3",
  "spacy>=3.8,<4",
  "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl#sha256=6f3c4b853852ea9e9d2dc76cc950dddb10a7e4c42d813308caefe6c5e8be2f0a",
  # Declared directly so the pytorch-cpu index in [tool.uv.sources] applies: without it
  # the transitive torch requirement resolves to the CUDA wheels.
  "torch>=2.2",
]

[project.optional-dependencies]
whatsapp = ["neonize>=0.5.2,<0.6", "segno>=1.6"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.17",
  "neonize>=0.5.2,<0.6",
  "segno>=1.6",
  "pyright>=1.1.390",
]

[project.urls]
Repository = "https://github.com/AMQS-Studio/MonoAgens"

[project.scripts]
monoagens = "monoagens.__main__:main"

[build-system]
# PEP 639 license metadata (`license` string plus `license-files`) needs setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monoagens*"]

[tool.setuptools.package-data]
monoagens = ["lang/*.yaml", "library/affect/*.json", "library/privacy/*.json", "library/safety/*.json", "library/style/*.json", "library/lexicon/*.json", "library/intent/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["monoagens/vendor"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C90",
  "PLR0912",
  "PLR0915",
  "RUF",
  "ASYNC",
  "PT",
  "FA",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Long prose lines inside the soul loader template and prompt scaffolding.
"monoagens/engine/soul.py" = ["E501"]
# Prompt copy reads as one sentence per line; wrapping the literal would hurt it.
"**/prompts.py" = ["E501"]
"**/decision.py" = ["E501"]
# Regex literals cannot be wrapped without changing the pattern.
"**/patterns.py" = ["E501"]
# Spreadsheet XML parts are literal content.
"scripts/xlsx.py" = ["E501"]
# `scripts/` puts the repo on sys.path before importing the package it enables.
"scripts/**" = ["E402"]
"migrations/env.py" = ["E402"]

# ADR-0031 §4.1 debt recorded when the ceiling landed: these functions are above it today.
# The list is per file on purpose, so a new module is still held to the rule. ADR-0037 §4.3
# moved `Agent._run_turn`/`Agent._handle_message` verbatim into `turn/loop.py` and
# `turn/intake.py`: the debt follows the function, not the file it used to sit in.
"monoagens/__main__.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/agent.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/turn/loop.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/turn/intake.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/jobs/ambient.py" = ["C901", "PLR0912"]
"monoagens/engine/commands/approve.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/commands/help.py" = ["C901", "PLR0912"]
"monoagens/engine/commands/memory.py" = ["C901", "PLR0912"]
"monoagens/engine/config.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/registry.py" = ["C901", "PLR0912"]
"monoagens/engine/plugins.py" = ["C901", "PLR0912"]
"monoagens/gateways/whatsapp/cli.py" = ["PLR0915"]
"scripts/neutral.py" = ["C901", "PLR0912"]
"monoagens/engine/turn/reply.py" = ["C901"]
"monoagens/engine/stores/affect.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/stores/recipes.py" = ["C901", "PLR0912"]
"monoagens/engine/stores/style.py" = ["C901", "PLR0912"]
"monoagens/engine/stores/documents.py" = ["C901", "PLR0912"]
"monoagens/engine/tools/__init__.py" = ["C901", "PLR0912"]
"monoagens/engine/tools/memory.py" = ["C901", "PLR0912", "PLR0915"]
"monoagens/engine/tools/settings.py" = ["C901", "PLR0912"]
"monoagens/gateways/whatsapp/commands/backfill.py" = ["C901", "PLR0915"]
"monoagens/gateways/whatsapp/gateway.py" = ["C901", "PLR0915"]
"monoagens/gateways/whatsapp/tools/chat_history.py" = ["C901", "PLR0912"]
"monoagens/gateways/whatsapp/tools/send_to.py" = ["C901", "PLR0912"]
"scripts/ablate.py" = ["PLR0915"]
"scripts/ablate_engine.py" = ["PLR0915"]

[tool.coverage.run]
branch = true
source = ["monoagens"]

[tool.pyright]
include = ["monoagens", "scripts"]
exclude = ["monoagens/vendor", "**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.uv]
# Mem0 pins protobuf<7 while Neonize needs >=6.32.1; both are core-adjacent installs, so one
# protobuf that satisfies Neonize is forced instead of letting the cap win.
override-dependencies = ["protobuf>=7"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
