[project]
name = "eidesoul"
version = "0.1.0"
description = "Eidesoul: a persistent soul engine."
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "openai>=2,<4",
  "mcp>=2.3,<3",
  "PyYAML>=6",
  "ddgs>=9",
]

[project.optional-dependencies]
# Mem0 pins protobuf<7 while Neonize needs protobuf>=7; install mem0ai with
# `pip install --no-deps "mem0ai>=2.2,<3"` after the whatsapp extra (see README).
memory = ["mem0ai>=2.2,<3", "sentence-transformers>=5.2,<6"]
whatsapp = ["neonize>=0.5.2,<0.6", "segno>=1.6"]
google = ["google-api-python-client>=2.150,<3", "google-auth>=2.35,<3", "httpx>=0.27,<1"]
vibe = ["torch>=2.2", "transformers>=4.40,<6"]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.17",
  "neonize>=0.5.2,<0.6",
  "segno>=1.6",
  "httpx>=0.27,<1",
]

[project.scripts]
eidesoul = "eidesoul.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eidesoul*"]

[tool.setuptools.package-data]
eidesoul = ["lang/*.yaml", "library/patterns/*.json", "library/facts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["eidesoul/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Long prose lines inside the soul loader template and prompt scaffolding.
"eidesoul/engine/soul.py" = ["E501"]

[tool.coverage.run]
branch = true
source = ["eidesoul"]

[tool.uv]
# Mem0 pins protobuf<7 while Neonize needs >=6.32.1; the older build still takes
# protobuf 7 through `--no-deps`, so resolution is forced with an override.
override-dependencies = ["protobuf>=7"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
