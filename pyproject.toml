[project]
name = "eidesoul"
version = "0.0.0.dev0"
description = "Eidesoul: a persistent soul engine."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abdul Muqsith", email = "136996767+inimuqsith@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "openai>=2,<4",
  "mcp>=2.3,<3",
  "PyYAML>=6",
  "ddgs>=9",
  "mem0ai>=2.2,<3",
  "sentence-transformers>=5.2,<6",
  # Declared directly so the pytorch-cpu index in [tool.uv.sources] applies: without it
  # the transitive torch requirement resolves to the CUDA wheels.
  "torch>=2.2",
]

[project.optional-dependencies]
whatsapp = ["neonize>=0.5.2,<0.6", "segno>=1.6"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.17",
  "neonize>=0.5.2,<0.6",
  "segno>=1.6",
  "httpx>=0.27,<1",
  "pyright>=1.1.390",
]

[project.urls]
Repository = "https://github.com/inimuqsith/Eidesoul"

[project.scripts]
eidesoul = "eidesoul.__main__:main"

[build-system]
# PEP 639 license metadata (`license` string plus `license-files`) needs setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eidesoul*"]

[tool.setuptools.package-data]
eidesoul = ["lang/*.yaml", "library/patterns/*.json", "library/facts/*.json", "library/affect/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["eidesoul/vendor"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C90",
  "PLR0912",
  "PLR0915",
  "RUF",
  "ASYNC",
  "PT",
  "FA",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Long prose lines inside the soul loader template and prompt scaffolding.
"eidesoul/engine/soul.py" = ["E501"]
# Prompt copy reads as one sentence per line; wrapping the literal would hurt it.
"**/prompts.py" = ["E501"]
"**/decision.py" = ["E501"]
# Regex literals cannot be wrapped without changing the pattern.
"**/patterns.py" = ["E501"]
# Spreadsheet XML parts are literal content.
"scripts/xlsx.py" = ["E501"]
# `scripts/` puts the repo on sys.path before importing the package it enables.
"scripts/**" = ["E402"]
"migrations/env.py" = ["E402"]

# ADR-0031 §4.1 debt recorded when the ceiling landed: these functions are above it today.
# The list is per file on purpose, so a new module is still held to the rule.
"eidesoul/__main__.py" = ["C901", "PLR0912", "PLR0915"]
"eidesoul/engine/agent.py" = ["C901", "PLR0912", "PLR0915"]
"eidesoul/engine/jobs/ambient.py" = ["C901", "PLR0912"]
"eidesoul/engine/commands/approve.py" = ["C901", "PLR0912", "PLR0915"]
"eidesoul/engine/commands/help.py" = ["C901", "PLR0912"]
"eidesoul/engine/commands/memori.py" = ["C901", "PLR0912"]
"eidesoul/engine/config.py" = ["C901", "PLR0915"]
"eidesoul/engine/registry.py" = ["C901", "PLR0912"]
"eidesoul/engine/turn/reply.py" = ["C901"]
"eidesoul/engine/stores/affect.py" = ["C901", "PLR0912", "PLR0915"]
"eidesoul/engine/stores/recipes.py" = ["C901", "PLR0912"]
"eidesoul/engine/stores/style.py" = ["C901", "PLR0912"]
"eidesoul/engine/tools/__init__.py" = ["C901", "PLR0912"]
"eidesoul/engine/tools/memory.py" = ["C901", "PLR0912", "PLR0915"]
"eidesoul/engine/tools/settings.py" = ["C901", "PLR0912"]
"eidesoul/gateways/whatsapp/commands/backfill.py" = ["C901", "PLR0915"]
"eidesoul/gateways/whatsapp/gateway.py" = ["C901", "PLR0915"]
"eidesoul/gateways/whatsapp/tools/chat_history.py" = ["C901", "PLR0912"]
"eidesoul/gateways/whatsapp/tools/send_to.py" = ["C901", "PLR0912"]
"scripts/ablate.py" = ["PLR0915"]
"scripts/ablate_engine.py" = ["PLR0915"]

[tool.coverage.run]
branch = true
source = ["eidesoul"]

[tool.pyright]
include = ["eidesoul", "scripts"]
exclude = ["eidesoul/vendor", "**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.uv]
# Mem0 pins protobuf<7 while Neonize needs >=6.32.1; both are core-adjacent installs, so one
# protobuf that satisfies Neonize is forced instead of letting the cap win.
override-dependencies = ["protobuf>=7"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
